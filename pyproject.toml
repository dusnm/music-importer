[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "music-importer"
version = "0.11.0"
description = "Imports music from slskd, a drop folder and Bandcamp into a beets-tagged library, with cover art and lyrics"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
    "beets[fetchart,chroma,lastgenre]==2.14.1",
    "mutagen==1.48.1",
    "pillow==13.0.0",
    "mozjpeg-lossless-optimization==1.3.3",
    "PyYAML",
    "bandcampsync==0.9.0",
]

[project.scripts]
music-importer = "music_importer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
