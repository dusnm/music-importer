[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "music-importer"
version = "0.6.0"
description = "slskd webhook -> beets import, cover art normalisation"
requires-python = ">=3.12,<3.15"
dependencies = [
    "beets[fetchart,chroma,lastgenre]==2.14.1",
    "mutagen==1.48.1",
    "pillow==13.0.0",
    "mozjpeg-lossless-optimization==1.3.3",
    "PyYAML",
    "bandcampsync==0.9.0",
]

[project.scripts]
music-importer = "music_importer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
